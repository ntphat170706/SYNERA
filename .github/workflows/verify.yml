name: Verify SYNERA
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # GitHub hosted Linux has Docker: MySqlIntegrationTest must run here.
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: mvn -B -ntp -f backend/pom.xml verify
      - name: Require MySQL integration tests
        run: python3 scripts/require-mysql-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: backend/target-verified/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:architecture && pnpm format:check && pnpm test && pnpm build
  sales-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/sales-mobile/package-lock.json
      - run: npm ci
      - run: npm run check && npm test && npm run export:web
  integrated-website:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: synera_local
          MYSQL_USER: synera
          MYSQL_PASSWORD: CiOnlyDatabasePassword2026
          MYSQL_ROOT_PASSWORD: CiOnlyRootPassword2026
          MYSQL_ROOT_HOST: '%'
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build && mvn -B -ntp -f backend/pom.xml -DskipTests package
      - name: Migrate isolated CI database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3307'
          DB_NAME: synera_local
          DB_USERNAME: synera
          MIGRATION_USERNAME: root
          MYSQL_ROOT_PASSWORD: CiOnlyRootPassword2026
        run: java -jar backend/target-verified/synera-backend-1.0.0-SNAPSHOT.jar --migrate-only 2>&1 | tee artifacts-ci-migration.log
      - name: Start integrated production assets with local identities
        env:
          LOCAL_MYSQL_PASSWORD: CiOnlyDatabasePassword2026
          SPRING_FLYWAY_ENABLED: 'false'
        run: |
          mkdir -p artifacts .tools
          cd backend
          java -jar target-verified/synera-backend-1.0.0-SNAPSHOT.jar --spring.profiles.active=local,local-mysql --debug=false --logging.level.root=INFO > ../artifacts/ci-backend.log 2>&1 &
          echo $! > ../.tools/ci-backend.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Browser API and responsive checks
        env:
          BROWSER_CHANNEL: chromium
          TEST_URL: http://127.0.0.1:8080
        run: pnpm test:e2e && pnpm test:design
      - name: Stop owned CI application
        if: always()
        run: if [ -f .tools/ci-backend.pid ]; then kill "$(cat .tools/ci-backend.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-website-evidence
          path: |
            artifacts/
            artifacts-ci-migration.log
