spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${LOCAL_MYSQL_PORT:3307}/synera_local?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=REQUIRED&characterEncoding=UTF-8
    username: synera
    password: ${LOCAL_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    user: ${LOCAL_MIGRATION_USERNAME:synera}
    password: ${LOCAL_MIGRATION_PASSWORD:${LOCAL_MYSQL_PASSWORD}}
    locations: classpath:db/mysql-bootstrap,classpath:db/updates,classpath:db/mysql-updates
