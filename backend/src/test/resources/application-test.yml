    secure-cookie: false
  storage:
    local-enabled: true
  jobs-enabled: false
  jwt:
    secret: synera-test-key-only-never-use-outside-automated-tests
  bootstrap:
    enabled: true
    password: TestPassword2026!
  integration:
    otp-mode: local
logging:
  level:
    root: WARN
    org.hibernate.SQL: WARN
